[project]
name = "kchat"
version = "0.0.4"
description = "Containerized Google ADK agent with native read-only SPARQL tools"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
  "aiomysql>=0.3.2",
  "asyncpg>=0.31.0",
  "google-adk>=2.5.0",
  "httpx>=0.28.1",
  "litellm>=1.93.0",
  "mcp>=1.8.0",
  "pyoxigraph>=0.5.9",
  "rdflib>=7.6.0",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparql_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
