[project]
name = "kchat"
version = "0.1.0"
description = "Containerized Google ADK agent with a read-only SPARQL MCP server"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "google-adk>=2.5.0,<2.6.0",
  "httpx>=0.28.1,<0.29.0",
  "litellm>=1.93.0",
  "mcp>=1.28.1",
  "pyoxigraph>=0.5.6,<0.6.0",
  "rdflib>=7.1.3,<8.0.0",
  "uvicorn>=0.51.0,<0.52.0",
]

[project.scripts]
sparql-mcp = "sparql_agent.mcp_server.__main__:main"

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparql_agent"]
