[project]
name = "kchat"
version = "0.0.2"
description = "Containerized Google ADK agent with a read-only SPARQL MCP server"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
  "google-adk>=2.5.0",
  "httpx>=0.28.1",
  "litellm>=1.93.0",
  "mcp>=1.28.1",
  "pyoxigraph>=0.5.9",
  "rdflib>=7.6.0",
  "uvicorn>=0.51.0",
]

[project.scripts]
sparql-mcp = "sparql_agent.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparql_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
